<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=720, initial-scale=1.0">
  <title>书签</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 720px;
      height: 500px;
      font-family: 'Geist', 'Plus Jakarta Sans', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background-color: #050505;
      color: #e2e8f0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .bg-gradient {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: -1;
      overflow: hidden;
    }

    .bg-gradient::before {
      content: '';
      position: absolute;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background:
        radial-gradient(circle at 20% 30%, rgba(139, 92, 246, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(16, 185, 129, 0.08) 0%, transparent 40%);
    }

    .header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.7rem 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      position: relative;
      z-index: 10;
      flex-shrink: 0;
    }

    .header-icon {
      width: 2rem;
      height: 2rem;
      border-radius: 0.5rem;
      background: linear-gradient(135deg, #8b5cf6, #3b82f6);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .header-icon svg {
      width: 1.1rem;
      height: 1.1rem;
      color: white;
    }

    .header-text h1 {
      font-size: 0.9rem;
      font-weight: 600;
      color: #e2e8f0;
      letter-spacing: -0.025em;
    }

    .header-stats {
      font-size: 0.75rem;
      color: #64748b;
      margin-left: auto;
    }

    .open-site-btn {
      padding: 0.35rem 0.75rem;
      background: rgba(139, 92, 246, 0.1);
      border: 1px solid rgba(139, 92, 246, 0.2);
      color: #a78bfa;
      font-size: 0.72rem;
      font-weight: 500;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      font-family: inherit;
    }

    .open-site-btn:hover {
      background: rgba(139, 92, 246, 0.2);
      border-color: rgba(139, 92, 246, 0.4);
    }

    .content {
      display: flex;
      flex: 1;
      overflow: hidden;
      position: relative;
      z-index: 10;
    }

    .sidebar {
      width: 200px;
      border-right: 1px solid rgba(255, 255, 255, 0.05);
      overflow-y: auto;
      padding: 0.5rem;
      flex-shrink: 0;
    }

    .main {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem;
    }

    .sidebar::-webkit-scrollbar,
    .main::-webkit-scrollbar { width: 4px; }
    .sidebar::-webkit-scrollbar-track,
    .main::-webkit-scrollbar-track { background: transparent; }
    .sidebar::-webkit-scrollbar-thumb,
    .main::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

    .tree-node {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.35rem 0.5rem;
      border-radius: 0.5rem;
      cursor: pointer;
      font-size: 0.8rem;
      color: #94a3b8;
      transition: all 0.15s;
    }

    .tree-node:hover { background: rgba(255, 255, 255, 0.04); color: #e2e8f0; }
    .tree-node.active { background: rgba(139, 92, 246, 0.15); color: #a78bfa; }

    .tree-toggle {
      width: 0.9rem;
      text-align: center;
      font-size: 0.65rem;
      flex-shrink: 0;
      user-select: none;
    }

    .tree-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .category-count {
      font-size: 0.65rem;
      color: #475569;
      flex-shrink: 0;
    }

    .bookmark-item {
      display: flex;
      align-items: center;
      padding: 0.45rem 0.75rem;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: all 0.15s;
    }

    .bookmark-item:hover { background: rgba(255, 255, 255, 0.04); }

    .bookmark-favicon {
      width: 1rem;
      height: 1rem;
      margin-right: 0.5rem;
      flex-shrink: 0;
      border-radius: 2px;
    }

    .bookmark-title {
      font-size: 0.8rem;
      color: #e2e8f0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }

    .empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 3rem 1rem;
      color: #475569;
      font-size: 0.8rem;
      text-align: center;
    }

    .empty svg {
      width: 2rem;
      height: 2rem;
      color: #334155;
    }
  </style>
</head>
<body>
  <div class="bg-gradient"></div>

  <div class="header">
    <div class="header-icon">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/>
      </svg>
    </div>
    <div class="header-text">
      <h1>书签</h1>
    </div>
    <span class="header-stats" id="stats"></span>
    <button class="open-site-btn" id="open-site">打开网站</button>
  </div>

  <div class="content">
    <div class="sidebar" id="tree"></div>
    <div class="main" id="list"></div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
