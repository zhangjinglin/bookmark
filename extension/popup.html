<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 320px; padding: 16px; font-family: -apple-system, sans-serif; }
    h3 { margin-bottom: 12px; font-size: 14px; color: #333; }
    .page-info { background: #f5f5f5; padding: 10px; border-radius: 4px; margin-bottom: 12px; font-size: 12px; color: #666; word-break: break-all; }
    .page-title { font-weight: bold; color: #333; margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    select { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; margin-bottom: 12px; font-size: 14px; }
    button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
    button:hover { background: #0056b3; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .success { color: #28a745; text-align: center; padding: 10px; }
    .error { color: #dc3545; text-align: center; padding: 10px; }
  </style>
</head>
<body>
  <h3>📚 添加书签</h3>
  <div class="page-info">
    <div class="page-title" id="page-title">加载中...</div>
    <div id="page-url"></div>
  </div>
  <select id="category-select">
    <option value="">无分类</option>
  </select>
  <button id="save-btn">保存</button>
  <div id="message"></div>
  <script src="popup.js"></script>
</body>
</html>
