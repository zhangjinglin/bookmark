<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookmark - 书签管理</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/phosphor-icons@1.4.2/src/css/icons.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Geist', 'Plus Jakarta Sans', 'PingFang SC', 'Microsoft YaHei', 'sans-serif'],
            display: ['Geist', 'Plus Jakarta Sans', 'sans-serif'],
          },
          colors: {
            dark: {
              50: '#f8fafc',
              100: '#e2e8f0',
              200: '#cbd5e1',
              300: '#94a3b8',
              400: '#64748b',
              500: '#475569',
              600: '#334155',
              700: '#1e293b',
              800: '#0f172a',
              900: '#020617',
              950: '#050505',
            },
            accent: {
              purple: '#8b5cf6',
              blue: '#3b82f6',
              green: '#10b981',
            }
          },
          borderRadius: {
            '4xl': '2rem',
            '5xl': '2.5rem',
          },
          boxShadow: {
            'glass': '0 8px 32px 0 rgba(31, 38, 135, 0.37)',
            'glass-inset': 'inset 0 1px 1px 0 rgba(255, 255, 255, 0.1)',
            'glow': '0 0 20px rgba(139, 92, 246, 0.3)',
          },
          backdropBlur: {
            'xs': '2px',
            '3xl': '64px',
          }
        }
      }
    }
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Geist', 'Plus Jakarta Sans', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background-color: #050505;
      color: #e2e8f0;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* 背景渐变光晕 */
    .bg-gradient {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: -1;
      overflow: hidden;
    }

    .bg-gradient::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: 
        radial-gradient(circle at 20% 30%, rgba(139, 92, 246, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(16, 185, 129, 0.1) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(59, 130, 246, 0.05) 0%, transparent 60%);
      animation: gradientMove 20s ease-in-out infinite;
    }

    @keyframes gradientMove {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      25% { transform: translate(5%, -5%) rotate(1deg); }
      50% { transform: translate(-3%, 3%) rotate(-1deg); }
      75% { transform: translate(3%, 5%) rotate(1deg); }
    }

    /* 玻璃效果 */
    .glass {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .glass-card {
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 
        0 8px 32px rgba(0, 0, 0, 0.4),
        inset 0 1px 1px rgba(255, 255, 255, 0.05);
    }

    /* 双层边框技术 */
    .double-bezel {
      position: relative;
      border-radius: 2rem;
      padding: 6px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.02));
      overflow: visible;
    }

    .double-bezel-inner {
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      border-radius: calc(2rem - 6px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.08);
      overflow: visible;
    }

    /* 自定义滚动条 */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.5);
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(139, 92, 246, 0.5);
      border-radius: 3px;
      transition: background 0.3s ease;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(139, 92, 246, 0.7);
    }

    /* 按钮悬停效果 */
    .btn-magnetic {
      position: relative;
      transition: all 0.3s cubic-bezier(0.32, 0.72, 0, 1);
    }

    .btn-magnetic:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px -10px rgba(139, 92, 246, 0.5);
    }

    .btn-magnetic:active {
      transform: scale(0.98) translateY(0);
    }

    /* 分类树 */
    #category-tree {
      min-height: 3rem;
      padding-bottom: 0.5rem;
    }

    #category-tree.drag-over-root {
      background: rgba(139, 92, 246, 0.05);
      outline: 1px dashed rgba(139, 92, 246, 0.5);
      outline-offset: -1px;
      border-radius: 0.75rem;
    }

    .tree-node {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      padding: 0.5rem 0.75rem;
      margin-bottom: 2px;
      border-radius: 0.75rem;
      cursor: pointer;
      color: #94a3b8;
      font-size: 0.875rem;
      transition: background 0.2s ease, color 0.2s ease;
      user-select: none;
    }

    .tree-node:hover {
      background: rgba(139, 92, 246, 0.08);
      color: #e2e8f0;
    }

    .tree-node.active {
      background: rgba(139, 92, 246, 0.12);
      color: #fff;
    }

    .tree-node.dragging {
      opacity: 0.5;
    }

    .tree-node.drag-over {
      background: rgba(139, 92, 246, 0.1);
      outline: 1px dashed rgba(139, 92, 246, 0.5);
    }

    .tree-node.drag-over-top {
      box-shadow: 0 -2px 0 0 #8b5cf6;
    }

    .tree-node.drag-over-bottom {
      box-shadow: 0 2px 0 0 #8b5cf6;
    }

    .tree-toggle {
      width: 1rem;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #64748b;
      font-size: 0.75rem;
    }

    .tree-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tree-node .category-count {
      margin-left: auto;
      flex-shrink: 0;
    }

    /* 侧边栏新建按钮 */
    .sidebar-add-btn {
      width: 1.75rem;
      height: 1.75rem;
      border-radius: 0.5rem;
      border: none;
      background: rgba(139, 92, 246, 0.1);
      color: #8b5cf6;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .sidebar-add-btn:hover {
      background: rgba(139, 92, 246, 0.25);
    }

    .sidebar-add-btn svg {
      width: 0.875rem;
      height: 0.875rem;
    }

    /* 数量badge */
    .category-count {
      font-size: 0.6875rem;
      color: #94a3b8;
      margin-left: 0.375rem;
    }

    /* 书签项动画 */
    .bookmark-item {
      transition: all 0.4s cubic-bezier(0.32, 0.72, 0, 1);
      transform-origin: center;
    }

    .bookmark-item:hover {
      transform: translateY(-4px) scale(1.01);
      box-shadow: 
        0 20px 40px -15px rgba(0, 0, 0, 0.5),
        0 0 0 1px rgba(139, 92, 246, 0.2);
    }

    /* 淡入动画 */
    .fade-in {
      animation: fadeIn 0.6s cubic-bezier(0.32, 0.72, 0, 1);
    }

    @keyframes fadeIn {
      from { 
        opacity: 0; 
        transform: translateY(20px) blur(10px);
      }
      to { 
        opacity: 1; 
        transform: translateY(0) blur(0);
      }
    }

    /* 滚动入场动画 */
    .scroll-reveal {
      opacity: 0;
      transform: translateY(30px);
      transition: all 0.8s cubic-bezier(0.32, 0.72, 0, 1);
    }

    .scroll-reveal.revealed {
      opacity: 1;
      transform: translateY(0);
    }

    /* 右键菜单 */
    .context-menu {
      position: fixed;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 1rem;
      box-shadow: 
        0 20px 40px -10px rgba(0, 0, 0, 0.5),
        inset 0 1px 1px rgba(255, 255, 255, 0.05);
      padding: 0.5rem;
      z-index: 1000;
      min-width: 180px;
    }

    .context-menu-item {
      padding: 0.75rem 1rem;
      cursor: pointer;
      font-size: 0.875rem;
      color: #94a3b8;
      border-radius: 0.75rem;
      transition: all 0.3s cubic-bezier(0.32, 0.72, 0, 1);
    }

    .context-menu-item:hover {
      background: rgba(139, 92, 246, 0.1);
      color: #e2e8f0;
      transform: translateX(4px);
    }

    .context-menu-item.active {
      color: #8b5cf6;
      font-weight: 500;
    }

    .context-menu-item.danger {
      color: #ef4444;
    }

    .context-menu-item.danger:hover {
      background: rgba(239, 68, 68, 0.1);
      color: #ef4444;
    }

    #context-menu-categories {
      max-height: 50vh;
      overflow-y: auto;
    }

    /* 模态框 */
    .modal-overlay {
      background: rgba(5, 5, 5, 0.8);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .modal-content {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 
        0 25px 50px -12px rgba(0, 0, 0, 0.5),
        inset 0 1px 1px rgba(255, 255, 255, 0.05);
    }

    /* 输入框 */
    .input-glass {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 1rem;
      transition: all 0.3s cubic-bezier(0.32, 0.72, 0, 1);
    }

    .input-glass:focus {
      outline: none;
      border-color: rgba(139, 92, 246, 0.5);
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
    }

    /* 拖拽效果 */
    .dragging {
      opacity: 0.5;
      transform: scale(1.05);
      z-index: 100;
    }

    .drag-over {
      background: rgba(139, 92, 246, 0.1);
      border-color: rgba(139, 92, 246, 0.3);
    }

    /* 噪点纹理 */
    .noise-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      z-index: 50;
      opacity: 0.03;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* 图标样式 */
    .icon-light {
      stroke-width: 1.5;
    }

    /* 统计数字动画 */
    .stat-number {
      background: linear-gradient(135deg, #8b5cf6, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
  </style>
</head>
<body class="bg-dark-950 min-h-screen">
  <!-- 背景渐变 -->
  <div class="bg-gradient"></div>
  
  <!-- 噪点纹理 -->
  <div class="noise-overlay"></div>

  <!-- 主容器 -->
  <div class="max-w-6xl mx-auto py-12 px-4 md:px-8 relative z-10">
    
    <!-- 标题区域 -->
    <header class="mb-12 scroll-reveal">
      <div class="flex items-center justify-between mb-6">
        <div class="flex items-center gap-4">
          <div class="w-12 h-12 rounded-4xl bg-gradient-to-br from-accent-purple to-accent-blue flex items-center justify-center">
            <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/>
            </svg>
          </div>
          <div>
            <h1 class="text-3xl md:text-4xl font-display font-semibold text-white tracking-tight">
              Bookmark
            </h1>
            <p class="text-dark-300 text-sm mt-1">个人书签管理</p>
          </div>
        </div>
      </div>
      
      <!-- 统计信息 -->
      <div class="flex flex-wrap items-center gap-6 mt-6">
        <div class="flex items-center gap-2">
          <div class="w-2 h-2 rounded-full bg-accent-purple"></div>
          <span class="text-sm text-dark-300"><span id="stat-bookmarks" class="stat-number font-semibold">0</span> 个收藏</span>
        </div>
        <div class="flex items-center gap-2">
          <div class="w-2 h-2 rounded-full bg-accent-blue"></div>
          <span class="text-sm text-dark-300"><span id="stat-categories" class="stat-number font-semibold">0</span> 个分类</span>
        </div>
        <div class="flex items-center gap-2">
          <div class="w-2 h-2 rounded-full bg-accent-green"></div>
          <span class="text-sm text-dark-300"><span id="stat-updated">最近更新 -</span></span>
        </div>
      </div>
    </header>

    <!-- 主区域：左侧分类树 + 右侧书签列表 -->
    <div class="flex flex-col md:flex-row gap-6 items-start">

      <!-- 左侧分类树 -->
      <aside class="w-full md:w-60 flex-shrink-0 scroll-reveal" style="transition-delay: 0.1s;">
        <div class="double-bezel">
          <div class="double-bezel-inner p-3">
            <div class="flex items-center justify-between px-1 mb-2">
              <span class="text-xs font-medium text-dark-400">分类</span>
              <button class="sidebar-add-btn" onclick="openAddCategoryModal()" title="新建顶级分类">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/>
                </svg>
              </button>
            </div>
            <div id="category-tree" ondragover="handleRootDragOver(event)" ondragleave="handleRootDragLeave(event)" ondrop="handleRootDrop(event)">
              <div class="tree-node active">
                <span class="tree-toggle"></span>
                <span class="tree-name">加载中...</span>
              </div>
            </div>
          </div>
        </div>
      </aside>

      <!-- 右侧书签列表 -->
      <div class="flex-1 min-w-0 w-full scroll-reveal" style="transition-delay: 0.2s;">
        <div class="double-bezel">
          <div class="double-bezel-inner p-4 md:p-6">
            <ul class="space-y-3" id="bookmark-list">
              <li class="py-12 text-center text-dark-400 text-sm">
                <div class="flex flex-col items-center gap-3">
                  <div class="w-12 h-12 rounded-4xl bg-dark-800 flex items-center justify-center">
                    <svg class="w-6 h-6 text-dark-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/>
                    </svg>
                  </div>
                  <span>加载中...</span>
                </div>
              </li>
            </ul>

            <!-- 底部统计 -->
            <div class="mt-6 text-right">
              <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full glass">
                <svg class="w-4 h-4 text-dark-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                </svg>
                <span id="bookmark-count" class="text-sm text-dark-300"></span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 右键菜单 -->
  <div class="context-menu hidden" id="context-menu">
    <div class="context-menu-item" style="color: #64748b; font-size: 0.75rem; cursor: default; padding: 0.5rem 1rem;">
      移动到分类
    </div>
    <div id="context-menu-categories"></div>
  </div>

  <!-- 分类右键菜单 -->
  <div class="context-menu hidden" id="category-context-menu">
    <div class="context-menu-item" onclick="openAddSubCategoryModal()">新建子分类</div>
    <div class="context-menu-item" onclick="openRenameCategoryModal()">重命名</div>
    <div class="context-menu-item danger" onclick="deleteCategoryFromMenu()">删除</div>
  </div>

  <!-- 分类编辑模态框 -->
  <div class="fixed inset-0 modal-overlay hidden items-center justify-center z-50 p-4" id="category-modal">
    <div class="modal-content rounded-4xl p-6 md:p-8 w-full max-w-md">
      <div class="flex items-center gap-3 mb-6">
        <div class="w-10 h-10 rounded-3xl bg-gradient-to-br from-accent-purple to-accent-blue flex items-center justify-center">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/>
          </svg>
        </div>
        <h3 class="text-xl font-display font-semibold text-white" id="modal-title">新建分类</h3>
      </div>
      
      <input type="text" id="category-name-input" placeholder="输入分类名称" 
        class="w-full px-5 py-4 input-glass text-white placeholder-dark-400 focus:outline-none">
      
      <div class="flex gap-3 mt-6 justify-end">
        <button class="px-6 py-3 text-sm font-medium text-dark-300 hover:text-white rounded-2xl hover:bg-dark-700 transition-all duration-300" onclick="closeCategoryModal()">
          取消
        </button>
        <button class="btn-magnetic px-6 py-3 text-sm font-medium bg-gradient-to-r from-accent-purple to-accent-blue text-white rounded-2xl hover:shadow-glow" onclick="saveCategory()">
          保存
        </button>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = window.location.origin;
    const listEl = document.getElementById('bookmark-list');
    const treeEl = document.getElementById('category-tree');
    const modal = document.getElementById('category-modal');
    const categoryNameInput = document.getElementById('category-name-input');
    const modalTitle = document.getElementById('modal-title');
    const bookmarkCount = document.getElementById('bookmark-count');
    
    let categories = [];
    let currentCategoryId = null;
    let editingCategoryId = null;
    let newCategoryParentId = null;
    let bookmarks = [];

    // 特殊标识：无分类筛选
    const NO_CATEGORY = '__none__';

    // 折叠的分类 id（持久化到 localStorage）
    let collapsedCategories = new Set(JSON.parse(localStorage.getItem('collapsedCategories') || '[]'));

    // HTML 转义，防止 XSS
    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, (ch) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[ch]));
    }

    // 只允许 http/https 链接，防止 javascript: 伪协议
    function safeUrl(url) {
      const value = String(url ?? '');
      return /^https?:\/\//i.test(value) ? value : '#';
    }

    // 加载分类
    async function loadCategories() {
      try {
        const res = await fetch(`${API_BASE}/api/categories`);
        categories = await res.json();
        renderCategoryTree();
        updateStats();
      } catch (err) {
        console.error('加载分类失败:', err);
      }
    }

    // 按父级分组构建树索引
    function buildCategoryTree() {
      const byParent = new Map();
      for (const c of categories) {
        const pid = c.parentId || null;
        if (!byParent.has(pid)) byParent.set(pid, []);
        byParent.get(pid).push(c);
      }
      for (const list of byParent.values()) {
        list.sort((a, b) => (a.order || 0) - (b.order || 0));
      }
      return byParent;
    }

    // 获取某分类的所有后代 id
    function getDescendantIds(id) {
      const result = [];
      const stack = [id];
      while (stack.length > 0) {
        const cur = stack.pop();
        for (const c of categories) {
          if ((c.parentId || null) === cur) {
            result.push(c.id);
            stack.push(c.id);
          }
        }
      }
      return result;
    }

    // 统计每个分类的书签数量（仅当前分类，不含子分类）
    function getCategoryCount(categoryId) {
      if (categoryId === null) return bookmarks.length;
      if (categoryId === NO_CATEGORY) {
        return bookmarks.filter(b => !b.categoryIds || b.categoryIds.length === 0).length;
      }
      return bookmarks.filter(b => b.categoryIds && b.categoryIds.includes(categoryId)).length;
    }

    // 渲染分类树
    function renderCategoryTree() {
      const byParent = buildCategoryTree();

      // "全部"节点
      let html = '<div class="tree-node' + (currentCategoryId === null ? ' active' : '') + '" onclick="filterByCategory(null)">' +
        '<span class="tree-toggle"></span>' +
        '<span class="tree-name">全部</span>' +
        '<span class="category-count">' + getCategoryCount(null) + '</span>' +
        '</div>';

      // "无分类"节点
      html += '<div class="tree-node' + (currentCategoryId === NO_CATEGORY ? ' active' : '') + '" onclick="filterByCategory(\'__none__\')">' +
        '<span class="tree-toggle"></span>' +
        '<span class="tree-name">无分类</span>' +
        '<span class="category-count">' + getCategoryCount(NO_CATEGORY) + '</span>' +
        '</div>';

      html += renderTreeLevel(byParent, null, 0);
      treeEl.innerHTML = html;
    }

    // 递归渲染某一层级的分类
    function renderTreeLevel(byParent, parentId, depth) {
      const list = byParent.get(parentId) || [];
      let html = '';
      for (const c of list) {
        const cId = escapeHtml(c.id);
        const children = byParent.get(c.id) || [];
        const hasChildren = children.length > 0;
        const expanded = !collapsedCategories.has(c.id);
        const activeClass = currentCategoryId === c.id ? ' active' : '';

        html += '<div class="tree-node' + activeClass + '" style="padding-left: ' + (0.75 + depth * 1) + 'rem" ' +
          'onclick="filterByCategory(\'' + cId + '\')" ' +
          'oncontextmenu="showCategoryContextMenu(event, \'' + cId + '\')" ' +
          'draggable="true" ' +
          'ondragstart="handleCategoryDragStart(event, \'' + cId + '\')" ' +
          'ondragend="handleCategoryDragEnd(event)" ' +
          'ondragover="handleCategoryDragOver(event)" ' +
          'ondragleave="handleCategoryDragLeave(event)" ' +
          'ondrop="handleCategoryDrop(event, \'' + cId + '\')">' +
          '<span class="tree-toggle"' + (hasChildren ? ' onclick="toggleExpand(event, \'' + cId + '\')"' : '') + '>' +
          (hasChildren ? (expanded ? '▾' : '▸') : '') + '</span>' +
          '<span class="tree-name">' + escapeHtml(c.name) + '</span>' +
          '<span class="category-count">' + getCategoryCount(c.id) + '</span>' +
          '</div>';

        if (hasChildren && expanded) {
          html += renderTreeLevel(byParent, c.id, depth + 1);
        }
      }
      return html;
    }

    // 展开/折叠分类
    function toggleExpand(event, categoryId) {
      event.stopPropagation();
      if (collapsedCategories.has(categoryId)) {
        collapsedCategories.delete(categoryId);
      } else {
        collapsedCategories.add(categoryId);
      }
      localStorage.setItem('collapsedCategories', JSON.stringify([...collapsedCategories]));
      renderCategoryTree();
    }

    // 按分类筛选书签
    function filterByCategory(categoryId) {
      currentCategoryId = categoryId;
      renderCategoryTree();
      renderBookmarks();
    }

    // 加载书签
    async function loadBookmarks() {
      try {
        const res = await fetch(`${API_BASE}/api/bookmarks`);
        bookmarks = await res.json();
        renderBookmarks();
        renderCategoryTree();
        updateStats();
        initScrollReveal();
      } catch (err) {
        listEl.innerHTML = `
          <li class="py-12 text-center text-dark-400 text-sm">
            <div class="flex flex-col items-center gap-3">
              <div class="w-12 h-12 rounded-4xl bg-dark-800 flex items-center justify-center">
                <svg class="w-6 h-6 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                </svg>
              </div>
              <span>加载失败</span>
            </div>
          </li>
        `;
      }
    }

    // 渲染书签列表
    function renderBookmarks() {
      let filtered = bookmarks;
      if (currentCategoryId === NO_CATEGORY) {
        filtered = bookmarks.filter(b => !b.categoryIds || b.categoryIds.length === 0);
      } else if (currentCategoryId) {
        // 只显示直接属于当前分类的书签，不含子分类
        filtered = bookmarks.filter(b => b.categoryIds && b.categoryIds.includes(currentCategoryId));
      }

      bookmarkCount.textContent = `共 ${filtered.length} 条书签`;

      if (filtered.length === 0) {
        listEl.innerHTML = `
          <li class="py-12 text-center text-dark-400 text-sm">
            <div class="flex flex-col items-center gap-3">
              <div class="w-12 h-12 rounded-4xl bg-dark-800 flex items-center justify-center">
                <svg class="w-6 h-6 text-dark-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/>
                </svg>
              </div>
              <span>暂无书签</span>
            </div>
          </li>
        `;
        return;
      }

      listEl.innerHTML = filtered.map((b, index) => `
        <li class="bookmark-item group flex items-center justify-between p-4 glass-card rounded-2xl scroll-reveal" 
            style="transition-delay: ${index * 0.05}s;"
            oncontextmenu="showContextMenu(event, '${escapeHtml(b.id)}')">
          <a href="${safeUrl(b.url)}" target="_blank" rel="noopener" title="${escapeHtml(b.title || b.url)}" 
            class="flex-1 text-sm font-medium text-dark-100 hover:text-accent-purple truncate transition-colors duration-300">
            ${escapeHtml(b.title || b.url)}
          </a>
          <button class="flex-shrink-0 ml-3 w-8 h-8 rounded-xl bg-dark-800/50 flex items-center justify-center text-dark-400 hover:text-red-500 hover:bg-red-500/10 opacity-0 group-hover:opacity-100 transition-all duration-300" onclick="deleteBookmark('${escapeHtml(b.id)}')">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        </li>
      `).join('');

      // 触发滚动入场动画
      setTimeout(() => {
        document.querySelectorAll('.scroll-reveal').forEach(el => {
          el.classList.add('revealed');
        });
      }, 100);
    }

    // 删除书签
    async function deleteBookmark(id) {
      try {
        await fetch(`${API_BASE}/api/bookmarks/${id}`, { method: 'DELETE' });
        loadBookmarks();
      } catch (err) {
        console.error('删除失败');
      }
    }

    // 打开新建顶级分类模态框
    function openAddCategoryModal() {
      editingCategoryId = null;
      newCategoryParentId = null;
      modalTitle.textContent = '新建分类';
      categoryNameInput.value = '';
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      setTimeout(() => categoryNameInput.focus(), 100);
    }

    // 打开新建子分类模态框（来自分类右键菜单）
    function openAddSubCategoryModal() {
      const parentId = categoryMenuTargetId;
      hideContextMenu();
      if (!parentId) return;
      editingCategoryId = null;
      newCategoryParentId = parentId;
      modalTitle.textContent = '新建子分类';
      categoryNameInput.value = '';
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      setTimeout(() => categoryNameInput.focus(), 100);
    }

    // 打开重命名模态框（来自分类右键菜单）
    function openRenameCategoryModal() {
      const id = categoryMenuTargetId;
      hideContextMenu();
      const category = categories.find(c => c.id === id);
      if (!category) return;
      editingCategoryId = id;
      newCategoryParentId = null;
      modalTitle.textContent = '重命名分类';
      categoryNameInput.value = category.name;
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      setTimeout(() => categoryNameInput.focus(), 100);
    }

    // 删除分类（来自分类右键菜单）
    function deleteCategoryFromMenu() {
      const id = categoryMenuTargetId;
      hideContextMenu();
      if (id) deleteCategory(id);
    }

    // 关闭模态框
    function closeCategoryModal() {
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    // 保存分类
    async function saveCategory() {
      const name = categoryNameInput.value.trim();
      if (!name) return alert('请输入分类名称');

      try {
        if (editingCategoryId) {
          await fetch(`${API_BASE}/api/categories/${editingCategoryId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name }),
          });
        } else {
          await fetch(`${API_BASE}/api/categories`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, parentId: newCategoryParentId }),
          });
        }
        newCategoryParentId = null;
        closeCategoryModal();
        loadCategories();
      } catch (err) {
        alert('保存失败');
      }
    }

    // 删除分类（子分类会提升到父级）
    async function deleteCategory(id) {
      if (!confirm('确定删除该分类？其子分类将提升到上一级。')) return;
      try {
        await fetch(`${API_BASE}/api/categories/${id}`, { method: 'DELETE' });
        if (currentCategoryId === id) currentCategoryId = null;
        collapsedCategories.delete(id);
        localStorage.setItem('collapsedCategories', JSON.stringify([...collapsedCategories]));
        loadCategories();
        renderBookmarks();
      } catch (err) {
        alert('删除失败');
      }
    }

    // 分类拖拽开始
    function handleCategoryDragStart(event, categoryId) {
      event.currentTarget.classList.add('dragging');
      event.dataTransfer.setData('text/plain', 'CATEGORY:' + categoryId);
      event.dataTransfer.effectAllowed = 'move';
    }

    // 分类拖拽结束
    function handleCategoryDragEnd(event) {
      if (event && event.currentTarget) event.currentTarget.classList.remove('dragging');
      document.querySelectorAll('.tree-node').forEach(node => {
        node.classList.remove('drag-over', 'drag-over-top', 'drag-over-bottom');
      });
      treeEl.classList.remove('drag-over-root');
    }

    // 分类拖拽经过（根据鼠标位置区分：上边缘=插到前面，中间=成为子分类，下边缘=插到后面）
    function handleCategoryDragOver(event) {
      event.preventDefault();
      event.dataTransfer.dropEffect = 'move';
      const node = event.currentTarget;
      const rect = node.getBoundingClientRect();
      const ratio = (event.clientY - rect.top) / rect.height;
      node.classList.remove('drag-over', 'drag-over-top', 'drag-over-bottom');
      if (ratio < 0.25) {
        node.classList.add('drag-over-top');
      } else if (ratio > 0.75) {
        node.classList.add('drag-over-bottom');
      } else {
        node.classList.add('drag-over');
      }
    }

    // 分类拖拽离开
    function handleCategoryDragLeave(event) {
      event.currentTarget.classList.remove('drag-over', 'drag-over-top', 'drag-over-bottom');
    }

    // 分类 drop
    async function handleCategoryDrop(event, targetCategoryId) {
      event.preventDefault();
      const node = event.currentTarget;
      node.classList.remove('drag-over', 'drag-over-top', 'drag-over-bottom');

      const data = event.dataTransfer.getData('text/plain');
      if (!data.startsWith('CATEGORY:')) return;

      const draggedId = data.slice('CATEGORY:'.length);
      if (draggedId === targetCategoryId) return;

      const dragged = categories.find(c => c.id === draggedId);
      const target = categories.find(c => c.id === targetCategoryId);
      if (!dragged || !target) return;

      // 不能拖到自己的后代上（会形成循环）
      if (getDescendantIds(draggedId).includes(targetCategoryId)) return;

      const rect = node.getBoundingClientRect();
      const ratio = (event.clientY - rect.top) / rect.height;

      if (ratio < 0.25 || ratio > 0.75) {
        // 放到上/下边缘：插入到目标所在层级的前面/后面
        await reorderCategory(dragged, target, ratio > 0.75);
      } else {
        // 放到中间：成为目标的子分类
        if ((dragged.parentId || null) === targetCategoryId) return;
        try {
          const response = await fetch(`${API_BASE}/api/categories/${draggedId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ parentId: targetCategoryId }),
          });
          if (response.ok) {
            // 展开目标分类，便于看到移动结果
            collapsedCategories.delete(targetCategoryId);
            localStorage.setItem('collapsedCategories', JSON.stringify([...collapsedCategories]));
            await loadCategories();
          } else {
            const err = await response.json().catch(() => null);
            alert(err?.error || '移动失败');
          }
        } catch (err) {
          console.error('移动分类失败:', err);
        }
      }
    }

    // 把 dragged 插入到 target 所在层级的前面或后面
    async function reorderCategory(dragged, target, insertAfter) {
      const parentId = target.parentId || null;
      const siblingIds = categories
        .filter(c => (c.parentId || null) === parentId && c.id !== dragged.id)
        .sort((a, b) => (a.order || 0) - (b.order || 0))
        .map(c => c.id);
      let targetIndex = siblingIds.indexOf(target.id);
      if (insertAfter) targetIndex += 1;
      siblingIds.splice(targetIndex, 0, dragged.id);

      try {
        // 跨父级移动时先更新 parentId
        if ((dragged.parentId || null) !== parentId) {
          const moveRes = await fetch(`${API_BASE}/api/categories/${dragged.id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ parentId }),
          });
          if (!moveRes.ok) return;
        }
        const response = await fetch(`${API_BASE}/api/categories/order`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ order: siblingIds }),
        });
        if (response.ok) {
          await loadCategories();
        }
      } catch (err) {
        console.error('排序保存失败:', err);
      }
    }

    // 拖到侧边栏空白处：移回顶级分类末尾
    function handleRootDragOver(event) {
      if (event.target !== event.currentTarget) return;
      event.preventDefault();
      event.dataTransfer.dropEffect = 'move';
      event.currentTarget.classList.add('drag-over-root');
    }

    function handleRootDragLeave(event) {
      if (event.target !== event.currentTarget) return;
      event.currentTarget.classList.remove('drag-over-root');
    }

    async function handleRootDrop(event) {
      if (event.target !== event.currentTarget) return;
      event.preventDefault();
      event.currentTarget.classList.remove('drag-over-root');
      const data = event.dataTransfer.getData('text/plain');
      if (!data.startsWith('CATEGORY:')) return;
      const draggedId = data.slice('CATEGORY:'.length);
      const dragged = categories.find(c => c.id === draggedId);
      if (!dragged || (dragged.parentId || null) === null) return;
      try {
        const response = await fetch(`${API_BASE}/api/categories/${draggedId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ parentId: null }),
        });
        if (response.ok) {
          await loadCategories();
        }
      } catch (err) {
        console.error('移动分类失败:', err);
      }
    }

    // 右键菜单相关
    const contextMenu = document.getElementById('context-menu');
    const contextMenuCategories = document.getElementById('context-menu-categories');
    const categoryContextMenu = document.getElementById('category-context-menu');
    let contextMenuBookmarkId = null;
    let categoryMenuTargetId = null;

    // 显示书签右键菜单
    function showContextMenu(event, bookmarkId) {
      event.preventDefault();
      contextMenuBookmarkId = bookmarkId;
      const bookmark = bookmarks.find(b => b.id === bookmarkId);
      const categoryIds = bookmark?.categoryIds || [];

      const noneItem = `
        <div class="context-menu-item ${categoryIds.length === 0 ? 'active' : ''}" 
          onclick="toggleBookmarkCategory('${escapeHtml(bookmarkId)}', null)">
          ${categoryIds.length === 0 ? '✓ ' : ''}无分类
        </div>`;

      contextMenuCategories.innerHTML = noneItem + buildMenuCategoryItems(categoryIds, bookmarkId, null, 0);

      positionContextMenu(contextMenu, event);
      categoryContextMenu.classList.add('hidden');
    }

    // 定位菜单：超出视口时向上翻转/向左收拢
    function positionContextMenu(menu, event) {
      const margin = 8;
      menu.style.left = '0px';
      menu.style.top = '0px';
      menu.style.maxHeight = '';
      menu.style.overflowY = '';
      menu.classList.remove('hidden');
      const rect = menu.getBoundingClientRect();
      if (rect.height > window.innerHeight - margin * 2) {
        menu.style.maxHeight = (window.innerHeight - margin * 2) + 'px';
        menu.style.overflowY = 'auto';
      }
      let left = event.clientX;
      let top = event.clientY;
      if (left + rect.width > window.innerWidth - margin) {
        left = Math.max(margin, window.innerWidth - rect.width - margin);
      }
      if (top + rect.height > window.innerHeight - margin) {
        top = Math.max(margin, event.clientY - rect.height);
      }
      menu.style.left = left + 'px';
      menu.style.top = top + 'px';
    }

    // 按树形结构生成分类菜单项
    function buildMenuCategoryItems(categoryIds, bookmarkId, parentId, depth) {
      const children = categories
        .filter(c => (c.parentId || null) === parentId)
        .sort((a, b) => (a.order || 0) - (b.order || 0));
      let html = '';
      for (const c of children) {
        html += `
        <div class="context-menu-item ${categoryIds.includes(c.id) ? 'active' : ''}" 
          style="padding-left: ${1 + depth * 1.25}rem"
          onclick="toggleBookmarkCategory('${escapeHtml(bookmarkId)}', '${escapeHtml(c.id)}')">
          ${categoryIds.includes(c.id) ? '✓ ' : ''}${escapeHtml(c.name)}
        </div>`;
        html += buildMenuCategoryItems(categoryIds, bookmarkId, c.id, depth + 1);
      }
      return html;
    }

    // 显示分类右键菜单
    function showCategoryContextMenu(event, categoryId) {
      event.preventDefault();
      event.stopPropagation();
      categoryMenuTargetId = categoryId;
      positionContextMenu(categoryContextMenu, event);
      contextMenu.classList.add('hidden');
    }

    // 切换书签分类
    async function toggleBookmarkCategory(bookmarkId, categoryId) {
      const bookmark = bookmarks.find(b => b.id === bookmarkId);
      if (!bookmark) return;

      let categoryIds = bookmark.categoryIds || [];
      if (categoryId === null) {
        categoryIds = [];
      } else if (categoryIds.includes(categoryId)) {
        categoryIds = categoryIds.filter(id => id !== categoryId);
      } else {
        categoryIds = [categoryId];
      }

      try {
        const response = await fetch(`${API_BASE}/api/bookmarks/${bookmarkId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ categoryIds }),
        });
        if (response.ok) {
          bookmark.categoryIds = categoryIds;
          hideContextMenu();
          renderBookmarks();
          renderCategoryTree();
        }
      } catch (err) {
        console.error('更新分类失败:', err);
      }
    }

    // 隐藏右键菜单
    function hideContextMenu() {
      contextMenu.classList.add('hidden');
      contextMenuBookmarkId = null;
      categoryContextMenu.classList.add('hidden');
      categoryMenuTargetId = null;
    }

    // 点击其他地方隐藏菜单
    document.addEventListener('click', hideContextMenu);

    // 键盘事件处理
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeCategoryModal();
        hideContextMenu();
      }
      if (e.key === 'Enter' && !modal.classList.contains('hidden')) {
        e.preventDefault();
        saveCategory();
      }
    });

    // 更新统计信息
    function updateStats() {
      document.getElementById('stat-bookmarks').textContent = bookmarks.length;
      document.getElementById('stat-categories').textContent = categories.length;
      
      if (bookmarks.length > 0) {
        const latest = bookmarks.reduce((a, b) => new Date(a.createdAt) > new Date(b.createdAt) ? a : b);
        const diff = Date.now() - new Date(latest.createdAt).getTime();
        const hours = Math.floor(diff / 3600000);
        const days = Math.floor(hours / 24);
        let timeStr = '';
        if (days > 0) timeStr = `${days} 天前`;
        else if (hours > 0) timeStr = `${hours} 小时前`;
        else timeStr = '刚刚';
        document.getElementById('stat-updated').textContent = `最近更新 ${timeStr}`;
      }
    }

    // 滚动入场动画
    let revealObserver = null;
    function initScrollReveal() {
      if (!revealObserver) {
        revealObserver = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add('revealed');
            }
          });
        }, { threshold: 0.1 });
      }

      document.querySelectorAll('.scroll-reveal').forEach(el => {
        revealObserver.observe(el);
      });
    }

    // 页面加载时初始化
    loadCategories();
    loadBookmarks();
    initScrollReveal();
  </script>
</body>
</html>
