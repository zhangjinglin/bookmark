<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookmark - 书签管理</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/phosphor-icons@1.4.2/src/css/icons.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Geist', 'Plus Jakarta Sans', 'PingFang SC', 'Microsoft YaHei', 'sans-serif'],
            display: ['Geist', 'Plus Jakarta Sans', 'sans-serif'],
          },
          colors: {
            dark: {
              50: '#f8fafc',
              100: '#e2e8f0',
              200: '#cbd5e1',
              300: '#94a3b8',
              400: '#64748b',
              500: '#475569',
              600: '#334155',
              700: '#1e293b',
              800: '#0f172a',
              900: '#020617',
              950: '#050505',
            },
            accent: {
              purple: '#8b5cf6',
              blue: '#3b82f6',
              green: '#10b981',
            }
          },
          borderRadius: {
            '4xl': '2rem',
            '5xl': '2.5rem',
          },
          boxShadow: {
            'glass': '0 8px 32px 0 rgba(31, 38, 135, 0.37)',
            'glass-inset': 'inset 0 1px 1px 0 rgba(255, 255, 255, 0.1)',
            'glow': '0 0 20px rgba(139, 92, 246, 0.3)',
          },
          backdropBlur: {
            'xs': '2px',
            '3xl': '64px',
          }
        }
      }
    }
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Geist', 'Plus Jakarta Sans', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background-color: #050505;
      color: #e2e8f0;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* 背景渐变光晕 */
    .bg-gradient {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: -1;
      overflow: hidden;
    }

    .bg-gradient::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: 
        radial-gradient(circle at 20% 30%, rgba(139, 92, 246, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(16, 185, 129, 0.1) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(59, 130, 246, 0.05) 0%, transparent 60%);
      animation: gradientMove 20s ease-in-out infinite;
    }

    @keyframes gradientMove {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      25% { transform: translate(5%, -5%) rotate(1deg); }
      50% { transform: translate(-3%, 3%) rotate(-1deg); }
      75% { transform: translate(3%, 5%) rotate(1deg); }
    }

    /* 玻璃效果 */
    .glass {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .glass-card {
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 
        0 8px 32px rgba(0, 0, 0, 0.4),
        inset 0 1px 1px rgba(255, 255, 255, 0.05);
    }

    /* 双层边框技术 */
    .double-bezel {
      position: relative;
      border-radius: 2rem;
      padding: 6px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.02));
      overflow: visible;
    }

    .double-bezel-inner {
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      border-radius: calc(2rem - 6px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.08);
      overflow: visible;
    }

    /* 自定义滚动条 */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.5);
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(139, 92, 246, 0.5);
      border-radius: 3px;
      transition: background 0.3s ease;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(139, 92, 246, 0.7);
    }

    /* 按钮悬停效果 */
    .btn-magnetic {
      position: relative;
      transition: all 0.3s cubic-bezier(0.32, 0.72, 0, 1);
    }

    .btn-magnetic:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px -10px rgba(139, 92, 246, 0.5);
    }

    .btn-magnetic:active {
      transform: scale(0.98) translateY(0);
    }

    /* 标签页动画 */
    .tab-item {
      position: relative;
      transition: all 0.3s cubic-bezier(0.32, 0.72, 0, 1);
    }

    .tab-item::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 0;
      height: 2px;
      background: linear-gradient(90deg, #8b5cf6, #3b82f6);
      transition: all 0.3s cubic-bezier(0.32, 0.72, 0, 1);
      transform: translateX(-50%);
    }

    .tab-item:hover::after,
    .tab-item.active::after {
      width: 80%;
    }

    .tab-item.active {
      color: #e2e8f0;
      background: rgba(139, 92, 246, 0.1);
    }

    /* 悬浮卡片容器 */
    .category-wrapper {
      position: relative;
      display: inline-flex;
      margin-bottom: 0.5rem;
    }

    /* 悬浮卡片 */
    .category-card {
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.15s ease, visibility 0.15s ease;
      z-index: 100;
      min-width: 120px;
      padding-top: 8px;
    }

    /* 卡片箭头 */
    .category-card::before {
      content: '';
      position: absolute;
      top: 2px;
      left: 50%;
      transform: translateX(-50%) rotate(45deg);
      width: 12px;
      height: 12px;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-bottom: none;
      border-right: none;
    }

    /* 卡片内容 */
    .category-card-content {
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 0.75rem;
      padding: 0.5rem;
      box-shadow: 
        0 20px 40px -10px rgba(0, 0, 0, 0.5),
        inset 0 1px 1px rgba(255, 255, 255, 0.05);
    }

    /* 卡片操作按钮 */
    .category-card-actions {
      display: flex;
      gap: 0.375rem;
    }

    .category-card-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.375rem;
      padding: 0.5rem 0.75rem;
      border-radius: 0.5rem;
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .category-card-btn svg {
      width: 14px;
      height: 14px;
    }

    .category-card-btn.edit {
      background: rgba(139, 92, 246, 0.1);
      color: #8b5cf6;
    }

    .category-card-btn.edit:hover {
      background: rgba(139, 92, 246, 0.2);
    }

    .category-card-btn.delete {
      background: rgba(239, 68, 68, 0.1);
      color: #ef4444;
    }

    .category-card-btn.delete:hover {
      background: rgba(239, 68, 68, 0.2);
    }

    /* 紧凑标签样式 */
    .tab-compact {
      padding: 0.375rem 0.75rem;
      font-size: 0.8125rem;
      border-radius: 0.5rem;
    }

    /* 数量badge */
    .category-count {
      font-size: 0.6875rem;
      color: #94a3b8;
      margin-left: 0.375rem;
    }

    /* 书签项动画 */
    .bookmark-item {
      transition: all 0.4s cubic-bezier(0.32, 0.72, 0, 1);
      transform-origin: center;
    }

    .bookmark-item:hover {
      transform: translateY(-4px) scale(1.01);
      box-shadow: 
        0 20px 40px -15px rgba(0, 0, 0, 0.5),
        0 0 0 1px rgba(139, 92, 246, 0.2);
    }

    /* 淡入动画 */
    .fade-in {
      animation: fadeIn 0.6s cubic-bezier(0.32, 0.72, 0, 1);
    }

    @keyframes fadeIn {
      from { 
        opacity: 0; 
        transform: translateY(20px) blur(10px);
      }
      to { 
        opacity: 1; 
        transform: translateY(0) blur(0);
      }
    }

    /* 滚动入场动画 */
    .scroll-reveal {
      opacity: 0;
      transform: translateY(30px);
      transition: all 0.8s cubic-bezier(0.32, 0.72, 0, 1);
    }

    .scroll-reveal.revealed {
      opacity: 1;
      transform: translateY(0);
    }

    /* 右键菜单 */
    .context-menu {
      position: fixed;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 1rem;
      box-shadow: 
        0 20px 40px -10px rgba(0, 0, 0, 0.5),
        inset 0 1px 1px rgba(255, 255, 255, 0.05);
      padding: 0.5rem;
      z-index: 1000;
      min-width: 180px;
    }

    .context-menu-item {
      padding: 0.75rem 1rem;
      cursor: pointer;
      font-size: 0.875rem;
      color: #94a3b8;
      border-radius: 0.75rem;
      transition: all 0.3s cubic-bezier(0.32, 0.72, 0, 1);
    }

    .context-menu-item:hover {
      background: rgba(139, 92, 246, 0.1);
      color: #e2e8f0;
      transform: translateX(4px);
    }

    .context-menu-item.active {
      color: #8b5cf6;
      font-weight: 500;
    }

    /* 模态框 */
    .modal-overlay {
      background: rgba(5, 5, 5, 0.8);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .modal-content {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 
        0 25px 50px -12px rgba(0, 0, 0, 0.5),
        inset 0 1px 1px rgba(255, 255, 255, 0.05);
    }

    /* 输入框 */
    .input-glass {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 1rem;
      transition: all 0.3s cubic-bezier(0.32, 0.72, 0, 1);
    }

    .input-glass:focus {
      outline: none;
      border-color: rgba(139, 92, 246, 0.5);
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
    }

    /* 拖拽效果 */
    .dragging {
      opacity: 0.5;
      transform: scale(1.05);
      z-index: 100;
    }

    .drag-over {
      background: rgba(139, 92, 246, 0.1);
      border-color: rgba(139, 92, 246, 0.3);
    }

    /* 噪点纹理 */
    .noise-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      z-index: 50;
      opacity: 0.03;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* 图标样式 */
    .icon-light {
      stroke-width: 1.5;
    }

    /* 统计数字动画 */
    .stat-number {
      background: linear-gradient(135deg, #8b5cf6, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
  </style>
</head>
<body class="bg-dark-950 min-h-screen">
  <!-- 背景渐变 -->
  <div class="bg-gradient"></div>
  
  <!-- 噪点纹理 -->
  <div class="noise-overlay"></div>

  <!-- 主容器 -->
  <div class="max-w-6xl mx-auto py-12 px-4 md:px-8 relative z-10">
    
    <!-- 标题区域 -->
    <header class="mb-12 scroll-reveal">
      <div class="flex items-center justify-between mb-6">
        <div class="flex items-center gap-4">
          <div class="w-12 h-12 rounded-4xl bg-gradient-to-br from-accent-purple to-accent-blue flex items-center justify-center">
            <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/>
            </svg>
          </div>
          <div>
            <h1 class="text-3xl md:text-4xl font-display font-semibold text-white tracking-tight">
              Bookmark
            </h1>
            <p class="text-dark-300 text-sm mt-1">个人书签管理</p>
          </div>
        </div>
        <button class="btn-magnetic flex items-center gap-2 px-4 py-2.5 text-sm font-medium bg-gradient-to-r from-accent-purple to-accent-blue text-white rounded-2xl hover:shadow-glow transition-all duration-300" onclick="openAddCategoryModal()">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/>
          </svg>
          新建分类
        </button>
      </div>
      
      <!-- 统计信息 -->
      <div class="flex flex-wrap items-center gap-6 mt-6">
        <div class="flex items-center gap-2">
          <div class="w-2 h-2 rounded-full bg-accent-purple"></div>
          <span class="text-sm text-dark-300"><span id="stat-bookmarks" class="stat-number font-semibold">0</span> 个收藏</span>
        </div>
        <div class="flex items-center gap-2">
          <div class="w-2 h-2 rounded-full bg-accent-blue"></div>
          <span class="text-sm text-dark-300"><span id="stat-categories" class="stat-number font-semibold">0</span> 个分类</span>
        </div>
        <div class="flex items-center gap-2">
          <div class="w-2 h-2 rounded-full bg-accent-green"></div>
          <span class="text-sm text-dark-300"><span id="stat-updated">最近更新 -</span></span>
        </div>
      </div>
    </header>

    <!-- 分类标签栏 -->
    <div class="mb-8 scroll-reveal" style="transition-delay: 0.1s; overflow: visible;">
      <div class="double-bezel">
        <div class="double-bezel-inner p-2">
          <div class="flex flex-wrap items-center gap-2 pb-1" id="category-bar">
            <span class="tab-item active px-5 py-2.5 text-sm font-medium cursor-pointer whitespace-nowrap rounded-xl" onclick="filterByCategory(null)">
              全部
            </span>
          </div>
        </div>
      </div>
    </div>

    <!-- 书签列表 -->
    <div class="scroll-reveal" style="transition-delay: 0.2s;">
      <div class="double-bezel">
        <div class="double-bezel-inner p-4 md:p-6">
          <ul class="space-y-3" id="bookmark-list">
            <li class="py-12 text-center text-dark-400 text-sm">
              <div class="flex flex-col items-center gap-3">
                <div class="w-12 h-12 rounded-4xl bg-dark-800 flex items-center justify-center">
                  <svg class="w-6 h-6 text-dark-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/>
                  </svg>
                </div>
                <span>加载中...</span>
              </div>
            </li>
          </ul>
        </div>
      </div>
    </div>

    <!-- 底部统计 -->
    <div class="mt-6 text-right scroll-reveal" style="transition-delay: 0.3s;">
      <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full glass">
        <svg class="w-4 h-4 text-dark-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
        </svg>
        <span id="bookmark-count" class="text-sm text-dark-300"></span>
      </div>
    </div>
  </div>

  <!-- 右键菜单 -->
  <div class="context-menu hidden" id="context-menu">
    <div class="context-menu-item" style="color: #64748b; font-size: 0.75rem; cursor: default; padding: 0.5rem 1rem;">
      移动到分类
    </div>
    <div id="context-menu-categories"></div>
  </div>

  <!-- 分类编辑模态框 -->
  <div class="fixed inset-0 modal-overlay hidden items-center justify-center z-50 p-4" id="category-modal">
    <div class="modal-content rounded-4xl p-6 md:p-8 w-full max-w-md">
      <div class="flex items-center gap-3 mb-6">
        <div class="w-10 h-10 rounded-3xl bg-gradient-to-br from-accent-purple to-accent-blue flex items-center justify-center">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/>
          </svg>
        </div>
        <h3 class="text-xl font-display font-semibold text-white" id="modal-title">新建分类</h3>
      </div>
      
      <input type="text" id="category-name-input" placeholder="输入分类名称" 
        class="w-full px-5 py-4 input-glass text-white placeholder-dark-400 focus:outline-none">
      
      <div class="flex gap-3 mt-6 justify-end">
        <button class="px-6 py-3 text-sm font-medium text-dark-300 hover:text-white rounded-2xl hover:bg-dark-700 transition-all duration-300" onclick="closeCategoryModal()">
          取消
        </button>
        <button class="btn-magnetic px-6 py-3 text-sm font-medium bg-gradient-to-r from-accent-purple to-accent-blue text-white rounded-2xl hover:shadow-glow" onclick="saveCategory()">
          保存
        </button>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = window.location.origin;
    const listEl = document.getElementById('bookmark-list');
    const categoryBar = document.getElementById('category-bar');
    const modal = document.getElementById('category-modal');
    const categoryNameInput = document.getElementById('category-name-input');
    const modalTitle = document.getElementById('modal-title');
    const bookmarkCount = document.getElementById('bookmark-count');
    
    let categories = [];
    let currentCategoryId = null;
    let editingCategoryId = null;
    let bookmarks = [];
    let draggedBookmarkId = null;

    // 加载分类
    async function loadCategories() {
      try {
        const res = await fetch(`${API_BASE}/api/categories`);
        categories = await res.json();
        renderCategories();
        updateStats();
      } catch (err) {
        console.error('加载分类失败:', err);
      }
    }

    // 统计每个分类的书签数量
    function getCategoryCount(categoryId) {
      if (categoryId === null) return bookmarks.length;
      return bookmarks.filter(b => b.categoryIds && b.categoryIds.includes(categoryId)).length;
    }

    // 渲染分类标签
    function renderCategories() {
      // 构建"全部"标签
      var allActiveClass = currentCategoryId === null ? 'active' : '';
      var allTag = '<span class="tab-item tab-compact ' + allActiveClass + ' cursor-pointer whitespace-nowrap" ' +
        'onclick="filterByCategory(null)" ' +
        'ondragover="handleCategoryDragOver(event)" ' +
        'ondragleave="handleCategoryDragLeave(event)" ' +
        'ondrop="handleCategoryDrop(event, null)">' +
        '全部<span class="category-count">' + getCategoryCount(null) + '</span>' +
        '</span>';
      
      var allCard = '<div class="category-card"><div class="category-card-content"><div class="category-card-actions">' +
        '<span class="category-card-btn edit" onclick="filterByCategory(null)">' +
        '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6h16M4 12h16M4 18h7"/></svg>' +
        '查看</span></div></div></div>';
      
      var allWrapper = '<div class="category-wrapper" onmouseenter="showCategoryCard(this)" onmouseleave="hideCategoryCard(this)">' +
        allTag + allCard + '</div>';
      
      // 构建分类标签
      var categoriesHtml = '';
      for (var i = 0; i < categories.length; i++) {
        var c = categories[i];
        var activeClass = currentCategoryId === c.id ? 'active' : '';
        
        var tag = '<span class="tab-item tab-compact ' + activeClass + ' cursor-pointer whitespace-nowrap" ' +
          'onclick="filterByCategory(\'' + c.id + '\')" ' +
          'draggable="true" ' +
          'ondragstart="handleCategoryDragStart(event, \'' + c.id + '\')" ' +
          'ondragend="handleCategoryDragEnd(event)" ' +
          'ondragover="handleCategoryDragOver(event)" ' +
          'ondragleave="handleCategoryDragLeave(event)" ' +
          'ondrop="handleCategoryDrop(event, \'' + c.id + '\')">' +
          c.name + '<span class="category-count">' + getCategoryCount(c.id) + '</span>' +
          '</span>';
        
        var card = '<div class="category-card"><div class="category-card-content"><div class="category-card-actions">' +
          '<span class="category-card-btn edit" onclick="editCategory(\'' + c.id + '\')">' +
          '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>' +
          '编辑</span>' +
          '<span class="category-card-btn delete" onclick="deleteCategory(\'' + c.id + '\')">' +
          '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>' +
          '删除</span></div></div></div>';
        
        var wrapper = '<div class="category-wrapper" onmouseenter="showCategoryCard(this)" onmouseleave="hideCategoryCard(this)">' +
          tag + card + '</div>';
        
        categoriesHtml += wrapper;
      }
      
      categoryBar.innerHTML = allWrapper + categoriesHtml;
    }

    // 悬浮卡片显示/隐藏控制
    let currentActiveCard = null;
    let hideCardTimer = null;

    function showCategoryCard(wrapper) {
      const card = wrapper.querySelector('.category-card');
      
      // 如果有其他卡片正在显示，先隐藏它
      if (currentActiveCard && currentActiveCard !== card) {
        currentActiveCard.style.opacity = '0';
        currentActiveCard.style.visibility = 'hidden';
        currentActiveCard.style.pointerEvents = 'none';
      }
      
      // 取消之前的隐藏定时器
      if (hideCardTimer) {
        clearTimeout(hideCardTimer);
        hideCardTimer = null;
      }
      
      // 显示当前卡片
      card.style.opacity = '1';
      card.style.visibility = 'visible';
      card.style.pointerEvents = 'auto';
      currentActiveCard = card;
    }

    function hideCategoryCard(wrapper) {
      const card = wrapper.querySelector('.category-card');
      hideCardTimer = setTimeout(() => {
        card.style.opacity = '0';
        card.style.visibility = 'hidden';
        card.style.pointerEvents = 'none';
        if (currentActiveCard === card) {
          currentActiveCard = null;
        }
      }, 100);
    }

    // 按分类筛选书签
    function filterByCategory(categoryId) {
      currentCategoryId = categoryId;
      renderCategories();
      renderBookmarks();
    }

    // 加载书签
    async function loadBookmarks() {
      try {
        const res = await fetch(`${API_BASE}/api/bookmarks`);
        bookmarks = await res.json();
        renderBookmarks();
        renderCategories();
        updateStats();
        initScrollReveal();
      } catch (err) {
        listEl.innerHTML = `
          <li class="py-12 text-center text-dark-400 text-sm">
            <div class="flex flex-col items-center gap-3">
              <div class="w-12 h-12 rounded-4xl bg-dark-800 flex items-center justify-center">
                <svg class="w-6 h-6 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                </svg>
              </div>
              <span>加载失败</span>
            </div>
          </li>
        `;
      }
    }

    // 渲染书签列表
    function renderBookmarks() {
      let filtered = bookmarks;
      if (currentCategoryId) {
        filtered = bookmarks.filter(b => b.categoryIds && b.categoryIds.includes(currentCategoryId));
      }

      bookmarkCount.textContent = `共 ${filtered.length} 条书签`;

      if (filtered.length === 0) {
        listEl.innerHTML = `
          <li class="py-12 text-center text-dark-400 text-sm">
            <div class="flex flex-col items-center gap-3">
              <div class="w-12 h-12 rounded-4xl bg-dark-800 flex items-center justify-center">
                <svg class="w-6 h-6 text-dark-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/>
                </svg>
              </div>
              <span>暂无书签</span>
            </div>
          </li>
        `;
        return;
      }

      listEl.innerHTML = filtered.map((b, index) => `
        <li class="bookmark-item group flex items-center justify-between p-4 glass-card rounded-2xl draggable scroll-reveal" 
            style="transition-delay: ${index * 0.05}s;"
            draggable="true" 
            ondragstart="handleDragStart(event, '${b.id}')" 
            oncontextmenu="showContextMenu(event, '${b.id}')">
          <a href="${b.url}" target="_blank" title="${b.title || b.url}" 
            class="flex-1 text-sm font-medium text-dark-100 hover:text-accent-purple truncate transition-colors duration-300">
            ${b.title || b.url}
          </a>
          <button class="flex-shrink-0 ml-3 w-8 h-8 rounded-xl bg-dark-800/50 flex items-center justify-center text-dark-400 hover:text-red-500 hover:bg-red-500/10 opacity-0 group-hover:opacity-100 transition-all duration-300" onclick="deleteBookmark('${b.id}')">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        </li>
      `).join('');

      // 触发滚动入场动画
      setTimeout(() => {
        document.querySelectorAll('.scroll-reveal').forEach(el => {
          el.classList.add('revealed');
        });
      }, 100);
    }

    // 添加书签
    async function addBookmark(url) {
      if (!url) return;
      try {
        await fetch(`${API_BASE}/api/bookmarks`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url, categoryIds: currentCategoryId ? [currentCategoryId] : [] }),
        });
        loadBookmarks();
      } catch (err) {
        console.error('添加失败');
      }
    }

    // 删除书签
    async function deleteBookmark(id) {
      try {
        await fetch(`${API_BASE}/api/bookmarks/${id}`, { method: 'DELETE' });
        loadBookmarks();
      } catch (err) {
        console.error('删除失败');
      }
    }

    // 更新书签分类
    async function updateBookmarkCategory(bookmarkId, categoryId) {
      try {
        const categoryIds = categoryId ? [categoryId] : [];
        const response = await fetch(`${API_BASE}/api/bookmarks/${bookmarkId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ categoryIds }),
        });
        if (response.ok) {
          await loadBookmarks();
        }
      } catch (err) {
        alert('更新失败');
      }
    }

    // 打开新建分类模态框
    function openAddCategoryModal() {
      editingCategoryId = null;
      modalTitle.textContent = '新建分类';
      categoryNameInput.value = '';
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      setTimeout(() => categoryNameInput.focus(), 100);
    }

    // 编辑分类
    function editCategory(id) {
      editingCategoryId = id;
      const category = categories.find(c => c.id === id);
      modalTitle.textContent = '编辑分类';
      categoryNameInput.value = category.name;
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      setTimeout(() => categoryNameInput.focus(), 100);
    }

    // 关闭模态框
    function closeCategoryModal() {
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    // 保存分类
    async function saveCategory() {
      const name = categoryNameInput.value.trim();
      if (!name) return alert('请输入分类名称');

      try {
        if (editingCategoryId) {
          await fetch(`${API_BASE}/api/categories/${editingCategoryId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name }),
          });
        } else {
          await fetch(`${API_BASE}/api/categories`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name }),
          });
        }
        closeCategoryModal();
        loadCategories();
      } catch (err) {
        alert('保存失败');
      }
    }

    // 删除分类
    async function deleteCategory(id) {
      if (!confirm('确定删除该分类？')) return;
      try {
        await fetch(`${API_BASE}/api/categories/${id}`, { method: 'DELETE' });
        if (currentCategoryId === id) currentCategoryId = null;
        loadCategories();
        renderBookmarks();
      } catch (err) {
        alert('删除失败');
      }
    }

    // 拖拽开始
    function handleDragStart(event, bookmarkId) {
      event.dataTransfer.setData('text/plain', 'bookmark:' + bookmarkId);
      event.dataTransfer.effectAllowed = 'move';
      event.target.classList.add('dragging');
    }

    // 拖拽结束
    function handleDragEnd(event) {
      event.target.classList.remove('dragging');
      draggedBookmarkId = null;
      document.querySelectorAll('.tab-item').forEach(tab => {
        tab.classList.remove('drag-over');
      });
    }

    // 分类拖拽开始
    function handleCategoryDragStart(event, categoryId) {
      event.target.classList.add('dragging');
      event.dataTransfer.setData('text/plain', 'CATEGORY:' + categoryId);
      event.dataTransfer.effectAllowed = 'move';
    }

    // 分类拖拽结束
    function handleCategoryDragEnd(event) {
      if (event && event.target) event.target.classList.remove('dragging');
      document.querySelectorAll('.tab-item').forEach(tab => {
        tab.classList.remove('drag-over');
      });
    }

    // 分类拖拽经过
    function handleCategoryDragOver(event) {
      event.preventDefault();
      event.dataTransfer.dropEffect = 'move';
      document.querySelectorAll('.tab-item').forEach(tab => {
        tab.classList.remove('drag-over');
      });
    }

    // 分类拖拽离开
    function handleCategoryDragLeave(event) {
      event.currentTarget.classList.remove('drag-over');
    }

    // 分类 drop
    async function handleCategoryDrop(event, targetCategoryId) {
      event.preventDefault();
      event.currentTarget.classList.remove('drag-over');
      const data = event.dataTransfer.getData('text/plain');
      if (data.startsWith('CATEGORY:')) {
        const draggedId = data.slice('CATEGORY:'.length);
        if (draggedId === targetCategoryId) return;
        const newOrder = categories
          .filter(c => c.id !== draggedId)
          .map(c => c.id);
        const targetIndex = newOrder.indexOf(targetCategoryId);
        newOrder.splice(targetIndex, 0, draggedId);
        try {
          const response = await fetch(`${API_BASE}/api/categories/order`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ order: newOrder }),
          });
          if (response.ok) {
            await loadCategories();
          }
        } catch (err) {
          console.error('排序保存失败:', err);
        }
      } else if (data.startsWith('bookmark:')) {
        await handleDrop(event, targetCategoryId);
      }
    }

    // 拖拽经过分类标签
    function handleDragOver(event) {
      event.preventDefault();
      event.dataTransfer.dropEffect = 'move';
      event.currentTarget.classList.add('drag-over');
    }

    // 拖拽离开分类标签
    function handleDragLeave(event) {
      event.currentTarget.classList.remove('drag-over');
    }

    // 放置到分类标签
    async function handleDrop(event, categoryId) {
      event.preventDefault();
      event.currentTarget.classList.remove('drag-over');
      
      const bookmarkId = event.dataTransfer.getData('text/plain');
      if (!bookmarkId) return;
      
      const bookmark = bookmarks.find(b => b.id === bookmarkId);
      if (!bookmark) return;
      
      let categoryIds = bookmark.categoryIds || [];
      
      if (categoryId === null) {
        categoryIds = [];
      } else {
        if (!categoryIds.includes(categoryId)) {
          categoryIds = [categoryId];
        }
      }
      
      try {
        const response = await fetch(`${API_BASE}/api/bookmarks/${bookmarkId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ categoryIds }),
        });
        
        if (response.ok) {
          bookmark.categoryIds = categoryIds;
          if (categoryId !== null && currentCategoryId !== null) {
            filterByCategory(null);
          } else {
            renderBookmarks();
          }
        }
      } catch (err) {
        console.error('更新分类失败:', err);
      }
    }

    // 右键菜单相关
    const contextMenu = document.getElementById('context-menu');
    const contextMenuCategories = document.getElementById('context-menu-categories');
    let contextMenuBookmarkId = null;

    // 显示右键菜单
    function showContextMenu(event, bookmarkId) {
      event.preventDefault();
      contextMenuBookmarkId = bookmarkId;
      const bookmark = bookmarks.find(b => b.id === bookmarkId);
      const categoryIds = bookmark?.categoryIds || [];

      contextMenuCategories.innerHTML = categories.map(c => `
        <div class="context-menu-item ${categoryIds.includes(c.id) ? 'active' : ''}" 
          onclick="toggleBookmarkCategory('${bookmarkId}', '${c.id}')">
          ${categoryIds.includes(c.id) ? '✓ ' : ''}${c.name}
        </div>
      `).join('');

      // 定位菜单
      contextMenu.style.left = event.clientX + 'px';
      contextMenu.style.top = event.clientY + 'px';
      contextMenu.classList.remove('hidden');
    }

    // 切换书签分类
    async function toggleBookmarkCategory(bookmarkId, categoryId) {
      const bookmark = bookmarks.find(b => b.id === bookmarkId);
      if (!bookmark) return;

      let categoryIds = bookmark.categoryIds || [];
      if (categoryIds.includes(categoryId)) {
        categoryIds = categoryIds.filter(id => id !== categoryId);
      } else {
        categoryIds = [categoryId];
      }

      try {
        const response = await fetch(`${API_BASE}/api/bookmarks/${bookmarkId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ categoryIds }),
        });
        if (response.ok) {
          bookmark.categoryIds = categoryIds;
          hideContextMenu();
          renderBookmarks();
          renderCategories();
        }
      } catch (err) {
        console.error('更新分类失败:', err);
      }
    }

    // 隐藏右键菜单
    function hideContextMenu() {
      contextMenu.classList.add('hidden');
      contextMenuBookmarkId = null;
    }

    // 点击其他地方隐藏菜单
    document.addEventListener('click', hideContextMenu);

    // ESC 键关闭模态框和右键菜单
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeCategoryModal();
        hideContextMenu();
      }
    });

    // 更新统计信息
    function updateStats() {
      document.getElementById('stat-bookmarks').textContent = bookmarks.length;
      document.getElementById('stat-categories').textContent = categories.length;
      
      if (bookmarks.length > 0) {
        const latest = bookmarks.reduce((a, b) => new Date(a.createdAt) > new Date(b.createdAt) ? a : b);
        const diff = Date.now() - new Date(latest.createdAt).getTime();
        const hours = Math.floor(diff / 3600000);
        const days = Math.floor(hours / 24);
        let timeStr = '';
        if (days > 0) timeStr = `${days} 天前`;
        else if (hours > 0) timeStr = `${hours} 小时前`;
        else timeStr = '刚刚';
        document.getElementById('stat-updated').textContent = `最近更新 ${timeStr}`;
      }
    }

    // 滚动入场动画
    function initScrollReveal() {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('revealed');
          }
        });
      }, { threshold: 0.1 });

      document.querySelectorAll('.scroll-reveal').forEach(el => {
        observer.observe(el);
      });
    }

    // 页面加载时初始化
    loadCategories();
    loadBookmarks();
    initScrollReveal();
  </script>
</body>
</html>
